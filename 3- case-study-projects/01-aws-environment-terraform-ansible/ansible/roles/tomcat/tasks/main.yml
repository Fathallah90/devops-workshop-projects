
---
# -------------------------------------------------------
# 1. Validate operating system
# -------------------------------------------------------

- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version == "22"
    fail_msg: "This role supports Ubuntu 22.04 only."


# -------------------------------------------------------
# 2. Install Java, Maven and Tomcat
# -------------------------------------------------------

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Install Java 11, Maven and Tomcat 9
  ansible.builtin.apt:
    name:
      - openjdk-11-jdk
      - maven
      - tomcat9
    state: present
    lock_timeout: 300


# -------------------------------------------------------
# 3. Clone application source
# -------------------------------------------------------

- name: Fetch VProfile source code
  ansible.builtin.git:
    repo: "{{ source_repo }}"
    dest: "{{ source_dir }}"
    version: "{{ source_revision }}"
    force: true
  no_log: true


# -------------------------------------------------------
# 4. Configure application properties
# -------------------------------------------------------

- name: Configure application connection settings
  ansible.builtin.template:
    src: application.properties.j2
    dest: "{{ source_dir }}/src/main/resources/application.properties"
    owner: root
    group: root
    mode: "0600"
  no_log: true


# -------------------------------------------------------
# 5. Verify backend connectivity
# -------------------------------------------------------

- name: Verify backend TCP connectivity
  ansible.builtin.wait_for:
    host: "{{ item.host }}"
    port: "{{ item.port }}"
    state: started
    timeout: 120
  loop:
    - host: "{{ db_host }}"
      port: "{{ db_port }}"
    - host: "{{ cache_host }}"
      port: "{{ cache_port }}"
    - host: "{{ queue_host }}"
      port: "{{ queue_port }}"


# -------------------------------------------------------
# 6. Build VProfile WAR
# -------------------------------------------------------

- name: Build application WAR
  ansible.builtin.command:
    cmd: mvn --batch-mode --no-transfer-progress clean verify
    chdir: "{{ source_dir }}"
  environment:
    JAVA_HOME: "{{ java_home }}"
    MAVEN_OPTS: "-Xmx384m"
  changed_when: true
  no_log: true


# -------------------------------------------------------
# 7. Configure Tomcat systemd service
# -------------------------------------------------------

- name: Create Tomcat systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/tomcat9.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Tomcat Java and heap settings
  ansible.builtin.copy:
    dest: /etc/systemd/system/tomcat9.service.d/vprofile.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Environment="JAVA_HOME={{ java_home }}"
      Environment="JAVA_OPTS={{ tomcat_java_opts }}"
      UMask=0027
  notify: Restart Tomcat


# -------------------------------------------------------
# 8. Validate built WAR artifact
# -------------------------------------------------------

- name: Check built WAR artifact
  ansible.builtin.stat:
    path: "{{ war_source }}"
    checksum_algorithm: sha256
  register: built_war

- name: Ensure WAR artifact exists
  ansible.builtin.assert:
    that:
      - built_war.stat.exists
      - built_war.stat.isreg
    fail_msg: "VProfile WAR was not generated by Maven."

- name: Check currently deployed WAR
  ansible.builtin.stat:
    path: "{{ war_destination }}"
    checksum_algorithm: sha256
  register: deployed_war


# -------------------------------------------------------
# 9. Deploy application
# -------------------------------------------------------

- name: Deploy changed WAR
  when: >
    deployed_war.stat.checksum | default('') !=
    built_war.stat.checksum
  block:

    - name: Stop Tomcat before deploying
      ansible.builtin.service:
        name: tomcat9
        state: stopped

    - name: Remove old exploded ROOT application
      ansible.builtin.file:
        path: /var/lib/tomcat9/webapps/ROOT
        state: absent

    - name: Install new WAR
      ansible.builtin.copy:
        src: "{{ war_source }}"
        dest: "{{ war_destination }}"
        remote_src: true
        owner: tomcat
        group: tomcat
        mode: "0640"
      no_log: true
      notify: Restart Tomcat


# -------------------------------------------------------
# 10. Apply configuration and start Tomcat
# -------------------------------------------------------

- name: Apply pending Tomcat configuration changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start Tomcat
  ansible.builtin.systemd:
    name: tomcat9
    daemon_reload: true
    enabled: true
    state: started


# -------------------------------------------------------
# 11. Verify application availability
# -------------------------------------------------------

- name: Wait for VProfile login page
  ansible.builtin.uri:
    url: "{{ application_health_url }}"
    method: GET
    status_code: 200
  register: login_check
  until: login_check.status | default(0) == 200
  retries: 30
  delay: 10
