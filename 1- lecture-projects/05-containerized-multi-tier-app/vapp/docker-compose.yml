
services:

  # ==================================================
  # MYSQL Database
  # ==================================================
  db01:
    image: ${MYSQL_IMAGE}
    container_name: ${DB_CONTAINER_NAME}

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    secrets:
      - mysql_root_password

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init/db_backup.sql:/docker-entrypoint-initdb.d/db_backup.sql:ro

    networks:
      - vprofile-network

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$(cat /run/secrets/mysql_root_password)" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 1m


  # ==================================================
  # Memcached
  # ==================================================
  mc01:
    image: memcached:1.6-alpine
    container_name: vprofile-memcached

    restart: unless-stopped

    command:
      - -m
      - "128"
      - -c
      - "1024"
      - -t
      - "4"
      - -l
      - 0.0.0.0

    networks:
      - vprofile-network

    healthcheck:
      test:
        - CMD-SHELL
        - "printf 'version\r\n' | nc 127.0.0.1 11211 | grep -q VERSION"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true


  # ==================================================
  # RabbitMQ
  # ==================================================
  rmq01:
    image: rabbitmq:3.13-management
    container_name: vprofile-rabbitmq

    hostname: rmq01

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: /

    secrets:
      - rabbitmq_password

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - vprofile-network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

    security_opt:
      - no-new-privileges:true


  # ==================================================
  # Tomcat Application
  # ==================================================
  app01:
    image: harbor.lab.local/devops-senior/vapp:v4
    container_name: vprofile-app

    restart: unless-stopped

    depends_on:
      db01:
        condition: service_healthy

      mc01:
        condition: service_healthy

      rmq01:
        condition: service_healthy

    networks:
      - vprofile-network


  # ==================================================
  # Nginx Reverse Proxy
  # ==================================================
  web01:
    image: nginx:1.28-alpine
    container_name: vprofile-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app01:
        condition: service_started

    networks:
      - vprofile-network

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

    security_opt:
      - no-new-privileges:true


# ==================================================
# Persistent Volumes
# ==================================================
volumes:

  mysql_data:
    name: ${DB_VOLUME_NAME}

  rabbitmq_data:
    name: vprofile_rabbitmq_data


# ==================================================
# Private Docker Network
# ==================================================
networks:

  vprofile-network:
    driver: bridge


# ==================================================
# Docker Secrets
# ==================================================
secrets:

  mysql_root_password:
    file: ./secrets/mysql_root_password.txt

  mysql_app_password:
    file: ./secrets/mysql_app_password.txt

  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
